name: benPilot recovery CI

on:
  pull_request:
    branches: [benPilot]
  push:
    branches: [benPilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery-checks:
    name: Recovery source and updater checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_installer: ${{ steps.scope.outputs.has_installer }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch the immutable original July baseline
        run: git fetch --no-tags --depth=1 origin b47add65d32e232b939d4915cca0b5a9ddafc48d
      - name: Verify provenance, unchanged driving payload and recipe consistency
        id: scope
        run: python3 recovery/ci/verify_scope.py
      - name: Exercise genuine updater reference handling with local Git remotes
        run: python3 recovery/test_update_ref.py
      - name: Test actual installer preflight with command and filesystem doubles
        if: steps.scope.outputs.has_installer == 'true'
        run: python3 recovery/installer/check_installer_guards.py
      - name: Record validation boundary
        run: |
          echo 'Recovery/installer checks only. Native Qualcomm models, inherited vehicle safety-test disagreements, actual device validation and verified backup/rollback remain pending.' >> "$GITHUB_STEP_SUMMARY"

  installer-arm64:
    name: Compile comma-three installer on ARM64
    needs: recovery-checks
    if: needs.recovery-checks.outputs.has_installer == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch the immutable original July baseline
        run: git fetch --no-tags --depth=1 origin b47add65d32e232b939d4915cca0b5a9ddafc48d
      - name: Build pinned dependency environment from the July lockfile
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          cp recovery/Dockerfile pyproject.toml uv.lock "$context/"
          docker build --platform linux/arm64 --progress plain -t jvepilot-july-c3-build:20261023 "$context"
          docker build --platform linux/arm64 --progress plain -t benpilot-installer-ci -f recovery/installer/Dockerfile recovery/installer
      - name: Compile only the pinned installer in an isolated container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/benpilot-installer"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 512 --memory 2500m --cpus 2 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.git,dst=/source.git,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/benpilot-installer,dst=/out" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/recovery/installer,dst=/recipe,readonly" \
            benpilot-installer-ci bash /recipe/build-installer.sh
          python3 recovery/ci/verify_installer_artifact.py "$RUNNER_TEMP/benpilot-installer/install-benpilot-comma3-candidate"
      - name: Upload candidate build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benPilot-installer-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/benpilot-installer/
          if-no-files-found: warn
          retention-days: 14
